<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filosofia | Diário</title>
  <link rel="stylesheet" href="./css/global.css">
</head>

<body>
  <aside class="menu-lateral">
    <h1>Painel Filosófico</h1>
    <nav>
      <a class="ativo" href="diario.html">Diário</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="login.html">Sair</a>
    </nav>
  </aside>

  <main class="conteudo">
    <h2 class="titulo">Diário Filosófico</h2>
    <p class="subtitulo">Registre suas reflexões e acompanhe sua jornada de pensamento.</p>
    <p class="subtitulo" id="status_diario">Verificando sessão...</p>

    <section class="layout-diario" id="diario_conteudo" style="display: none;">
      <article class="card area-reflexao">
        <h2>Nova Reflexão</h2>

        <div class="campo">
          <span>Título:</span>
          <input id="titulo_reflexao_input" type="text" placeholder="Ex.: O peso das escolhas" maxlength="150">
        </div>

        <div class="campo">
          <span>Conteúdo:</span>
          <textarea id="conteudo_reflexao_input" placeholder="Escreva sua reflexão, dúvida ou insight filosófico..."></textarea>
        </div>

        <button id="botao_publicar_reflexao" class="botao-enviar" onclick="publicarReflexao()">Publicar reflexão</button>
      </article>

      <aside class="card">
        <h2>Histórico de Reflexões</h2>
        <ul class="historico-lista" id="historico_lista">
          <li class="historico-item">
            <strong>Nenhuma reflexão carregada.</strong>
            <span>--/--/----</span>
          </li>
        </ul>
      </aside>
    </section>
  </main>

  <script src="./js/script.js"></script>
</body>

</html>
