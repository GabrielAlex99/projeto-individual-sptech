<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filosofia | Dashboard</title>
  <link rel="stylesheet" href="./css/global.css">
</head>

<body>
  <aside class="menu-lateral">
    <h1>Painel Filosófico</h1>
    <nav>
      <a href="diario.html">Diário</a>
      <a class="ativo" href="dashboard.html">Dashboard</a>
      <a href="descoberta.html">Descoberta</a>
      <a href="login.html">Sair</a>
    </nav>
  </aside>

  <main class="conteudo">
    <h2 class="titulo">Dashboard</h2>
    <p class="subtitulo">Distribuição das correntes escolhidas na pergunta filosófica ativa.</p>
    <p class="subtitulo" id="status_dashboard">Carregando respostas registradas...</p>

    <section class="painel">
      <article class="card">
        <h2>Respostas por corrente filosófica</h2>
        <section id="resumo_metricas_dashboard" class="resumo-metricas-dashboard" style="display: none;">
          <p><strong>Total de respostas:</strong> <span id="total_respostas_dashboard"></span></p>
          <p><strong>Corrente com mais respostas:</strong> <span id="corrente_lider_dashboard"></span></p>
        </section>
        <div class="grafico-container">
          <canvas id="graficoTemas"></canvas>
        </div>
        <ul id="metricas_textuais" class="metricas-textuais" style="display: none;"></ul>
      </article>
    </section>
  </main>

  <script src="./js/script.js"></script>
</body>

</html>
