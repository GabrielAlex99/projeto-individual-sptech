<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filosofia | Início</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Times New Roman", Georgia, serif;
            background: radial-gradient(circle at top, #1a1a1a 0%, #0b0b0d 55%, #050506 100%);
            color: #e7e3d5;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            padding: 24px 8%;
            border-bottom: 1px solid #2f2f33;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #c8c1a8;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 8%;
        }

        .hero {
            max-width: 760px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.2;
            margin-bottom: 20px;
            color: #f6f1df;
        }

        p {
            color: #b9b2a0;
            margin-bottom: 36px;
            font-size: 1.1rem;
        }

        .botao-descoberta {
            display: inline-block;
            text-decoration: none;
            background: #d8b46a;
            color: #151515;
            padding: 14px 30px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(216, 180, 106, 0.2);
        }

        .botao-descoberta:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(216, 180, 106, 0.3);
        }
    </style>
</head>

<body>
    <header>
        Projeto Filosofia
    </header>

    <main>
        <section class="hero">
            <h1>Conhecer o mundo começa por conhecer a si mesmo.</h1>
            <p>Uma jornada de autoconhecimento filosófico em uma experiência sóbria, direta e reflexiva.</p>
            <a class="botao-descoberta" href="cadastro.html">Descubra sua Corrente Filosófica</a>
        </section>
    </main>
</body>

</html>
