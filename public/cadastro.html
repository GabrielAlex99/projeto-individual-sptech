<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filosofia | Cadastro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Times New Roman", Georgia, serif;
      background: radial-gradient(circle at top, #1a1a1a 0%, #0b0b0d 55%, #050506 100%);
      color: #e7e3d5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(16, 16, 18, 0.9);
      border: 1px solid #2f2f33;
      border-radius: 10px;
      padding: 32px;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin-bottom: 8px;
      color: #f6f1df;
      font-size: 2rem;
    }

    .subtitulo {
      color: #b9b2a0;
      margin-bottom: 24px;
    }

    .campo {
      margin-bottom: 14px;
    }

    .campo span {
      display: block;
      margin-bottom: 6px;
      color: #d1c9b3;
    }

    .campo input {
      width: 100%;
      padding: 12px;
      border: 1px solid #3a3a40;
      border-radius: 6px;
      background: #101014;
      color: #ece7d7;
      font-family: inherit;
      outline: none;
    }

    .campo input:focus {
      border-color: #d8b46a;
    }

    .botao {
      width: 100%;
      border: none;
      margin-top: 8px;
      padding: 13px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      background: #d8b46a;
      color: #151515;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 24px rgba(216, 180, 106, 0.2);
    }

    .botao:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(216, 180, 106, 0.3);
    }

    .card_erro {
      display: none;
      margin-bottom: 16px;
      border: 1px solid #7a2b2b;
      background: rgba(122, 43, 43, 0.15);
      color: #ffb6b6;
      border-radius: 6px;
      padding: 10px;
    }

    .loading-div {
      display: none;
      margin-top: 14px;
      text-align: center;
    }

    .loading-div img {
      width: 38px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Cadastro</h1>
    <p class="subtitulo">Dê o primeiro passo na sua jornada filosófica.</p>

    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>

    <div class="campo">
      <span>Nome:</span>
      <input id="nome_input" type="text" placeholder="Seu nome" />
    </div>
    <div class="campo">
      <span>Email:</span>
      <input id="email_input" type="text" placeholder="seuemail@provedor.com" />
    </div>
    <div class="campo">
      <span>Senha:</span>
      <input id="senha_input" type="password" placeholder="******" />
    </div>
    <div class="campo">
      <span>Confirmação de Senha:</span>
      <input id="confirmacao_senha_input" type="password" placeholder="******" />
    </div>

    <button class="botao" onclick="cadastrar()">Iniciar Jornada</button>

    <div id="div_aguardar" class="loading-div">
      <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando" />
    </div>

    <div id="div_erros_login"></div>
  </main>

  <script>
    function cadastrar() {
      const nomeVar = nome_input.value;
      const emailVar = email_input.value;
      const senhaVar = senha_input.value;
      const confirmacaoSenhaVar = confirmacao_senha_input.value;

      if (
        nomeVar === "" ||
        emailVar === "" ||
        senhaVar === "" ||
        confirmacaoSenhaVar === ""
      ) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos para continuar.";
        setTimeout(sumirMensagem, 5000);
        return false;
      }

      if (senhaVar !== confirmacaoSenhaVar) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "A confirmação de senha não corresponde.";
        setTimeout(sumirMensagem, 5000);
        return false;
      }

      // Envia os dados de cadastro para a rota de usuários
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
        }),
      })
        .then(function (resposta) {
          if (resposta.ok) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando para login...";

            setTimeout(function () {
              window.location = "login.html";
            }, 2000);
          } else {
            throw "Houve um erro ao tentar realizar o cadastro.";
          }
        })
        .catch(function (erro) {
          console.log(`#ERRO: ${erro}`);
          cardErro.style.display = "block";
          mensagem_erro.innerHTML = "Não foi possível concluir o cadastro.";
        });

      return false;
    }

    function sumirMensagem() {
      cardErro.style.display = "none";
    }
  </script>
</body>

</html>
