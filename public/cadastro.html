<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filosofia | Cadastro</title>
  <link rel="stylesheet" href="./css/global.css">
</head>

<body>
  <main class="card">
    <h1>Cadastro</h1>
    <p class="subtitulo">Dê o primeiro passo na sua jornada filosófica.</p>

    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>

    <div class="campo">
      <span>Nome:</span>
      <input id="nome_input" type="text" placeholder="Seu nome" />
    </div>
    <div class="campo">
      <span>Email:</span>
      <input id="email_input" type="text" placeholder="seuemail@provedor.com" />
    </div>
    <div class="campo">
      <span>Senha:</span>
      <input id="senha_input" type="password" placeholder="******" />
    </div>
    <div class="campo">
      <span>Confirmação de Senha:</span>
      <input id="confirmacao_senha_input" type="password" placeholder="******" />
    </div>

    <button class="botao" onclick="cadastrar()">Iniciar Jornada</button>

    <div id="div_aguardar" class="loading-div">
      <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando" />
    </div>

    <div id="div_erros_login"></div>
  </main>
  <script src="./js/script.js"></script>
</body>
</html>
