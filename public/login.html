<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filosofia | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Times New Roman", Georgia, serif;
            background: radial-gradient(circle at top, #1a1a1a 0%, #0b0b0d 55%, #050506 100%);
            color: #e7e3d5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(16, 16, 18, 0.9);
            border: 1px solid #2f2f33;
            border-radius: 10px;
            padding: 32px;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin-bottom: 8px;
            color: #f6f1df;
            font-size: 2rem;
        }

        .citacao {
            margin-bottom: 24px;
            color: #b9b2a0;
            font-style: italic;
        }

        .card_erro {
            display: none;
            margin-bottom: 16px;
            border: 1px solid #7a2b2b;
            background: rgba(122, 43, 43, 0.15);
            color: #ffb6b6;
            border-radius: 6px;
            padding: 10px;
        }

        .campo {
            margin-bottom: 14px;
        }

        .campo span {
            display: block;
            margin-bottom: 6px;
            color: #d1c9b3;
        }

        .campo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #3a3a40;
            border-radius: 6px;
            background: #101014;
            color: #ece7d7;
            font-family: inherit;
            outline: none;
        }

        .campo input:focus {
            border-color: #d8b46a;
        }

        .botao {
            width: 100%;
            border: none;
            margin-top: 8px;
            padding: 13px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            background: #d8b46a;
            color: #151515;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(216, 180, 106, 0.2);
        }

        .botao:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(216, 180, 106, 0.3);
        }

        .loading-div {
            display: none;
            margin-top: 14px;
            text-align: center;
        }

        .loading-div img {
            width: 38px;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Retorno</h1>
        <p class="citacao">"Saber que nada sabemos é o princípio da sabedoria."</p>

        <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
        </div>

        <div class="campo">
            <span>Email:</span>
            <input id="email_input" type="text" placeholder="seuemail@provedor.com">
        </div>
        <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******">
        </div>

        <button class="botao" onclick="entrar()">Retomar Reflexão</button>

        <div id="div_aguardar" class="loading-div">
            <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando">
        </div>

        <div id="div_erros_login"></div>
    </main>

    <script>
        // Envia os dados de login para autenticação na rota de usuários
        function entrar() {
            const emailVar = email_input.value;
            const senhaVar = senha_input.value;

            if (emailVar === "" || senhaVar === "") {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = "Preencha email e senha para continuar.";
                return false;
            } else {
                setTimeout(sumirMensagem, 5000);
            }

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: emailVar,
                    senhaServer: senhaVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(json => {
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;
                        sessionStorage.AQUARIOS = JSON.stringify(json.aquarios);

                        setTimeout(function () {
                            window.location = "./diario.html";
                        }, 1000);
                    });
                } else {
                    console.log("Houve um erro ao tentar realizar o login!");

                    resposta.text().then(texto => {
                        console.error(texto);
                    });
                }
            }).catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
            });

            return false;
        }

        function sumirMensagem() {
            cardErro.style.display = "none";
        }
    </script>
</body>

</html>
