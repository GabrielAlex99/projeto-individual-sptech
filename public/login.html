<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filosofia | Login</title>
    <link rel="stylesheet" href="./css/global.css">
</head>

<body>
    <main class="card">
        <h1>Retorno</h1>
        <p class="citacao">"Saber que nada sabemos é o princípio da sabedoria."</p>

        <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
        </div>

        <div class="campo">
            <span>Email:</span>
            <input id="email_input" type="text" placeholder="seuemail@provedor.com">
        </div>
        <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******">
        </div>

        <button class="botao" onclick="entrar()">Retomar Reflexão</button>

        <div id="div_aguardar" class="loading-div">
            <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando">
        </div>

        <div id="div_erros_login"></div>
    </main>
    <script src="./js/script.js"></script>
</body>

</html>
